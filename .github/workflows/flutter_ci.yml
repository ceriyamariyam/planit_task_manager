name: PlanIt CI/CD Pipeline

on:
  push:
    branches: [ main, dev, qa ]
  pull_request:
    branches: [ main, dev, qa ]

jobs:
  build-and-test:
    name: Code Quality, Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      # Gradle ഡൗൺലോഡ് ഉറപ്പാക്കാനും ടൈംഔട്ട് ഒഴിവാക്കാനുമുള്ള സ്റ്റെപ്പ്
      - name: Pre-download Gradle Wrapper with Retry
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew --version && break || sleep 10; done

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanIt-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk